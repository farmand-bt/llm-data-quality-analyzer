[project]
name = "llm-data-quality-analyzer"
version = "0.1.0"
description = "Data profiling, cleaning, and LLM-powered quality insights for CSV and Excel files"
requires-python = ">=3.10"
dependencies = [
    "pandas>=2.0",
    "numpy>=1.24",
    "scipy>=1.10",
    "plotly>=5.0",
    "openpyxl>=3.1",
    "streamlit>=1.30",
    "openai>=1.0",
    "python-dotenv>=1.0",
    "chardet>=5.0",
]

[dependency-groups]
dev = [
    "ruff>=0.4",
    "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["app", "profiler", "cleaner", "narrator", "config"]

[tool.ruff]
line-length = 88
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I"]
